
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Node Shop</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">

        <div class="logo">NodeShop</div>

        <div class="search-box">
            <input type="text" placeholder="Search products...">
            <button>Search</button>
        </div>

        <nav>
            <a href="/">Home</a>
            <a href="/product">Products</a>
            <a href="/cart">Cart</a>
        </nav>

    </header>


    <!-- Hero Section -->
    <section class="hero">

        <h1>Welcome to NodeShop</h1>

        <p>Find amazing products at great prices.</p>

        <button>Shop Now</button>

    </section>


    <!-- Products -->
    <section class="products">

        <div class="card">
            <img src="https://placehold.co/200" alt="Laptop">
            <h3>Laptop</h3>
            <p>$899</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://placehold.co/200" alt="Headphones">
            <h3>Headphones</h3>
            <p>$120</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://placehold.co/200" alt="Smart Watch">
            <h3>Smart Watch</h3>
            <p>$199</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://placehold.co/200" alt="Camera">
            <h3>Camera</h3>
            <p>$499</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://placehold.co/200" alt="Keyboard">
            <h3>Keyboard</h3>
            <p>$79</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://placehold.co/200" alt="Mouse">
            <h3>Mouse</h3>
            <p>$39</p>
            <button>Add to Cart</button>
        </div>

    </section>


    <!-- Footer -->
    <footer>
        <p>© 2026 NodeShop | Built with HTML & CSS</p>
    </footer>

</body>

</html>
