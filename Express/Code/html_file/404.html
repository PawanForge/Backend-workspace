<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 40px 20px;
    }

    .error {
      font-size: 150px;
      font-weight: 900;
      line-height: 1;
      color: #38bdf8;
      text-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
      animation: float 3s ease-in-out infinite;
    }

    h1 {
      font-size: 36px;
      margin: 20px 0 10px;
    }

    p {
      font-size: 18px;
      color: #94a3b8;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .home-btn {
      display: inline-block;
      padding: 14px 28px;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      transition: 0.3s;
    }

    .home-btn:hover {
      background: #7dd3fc;
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
    }

    .astronaut {
      font-size: 70px;
      margin-bottom: 10px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    @media (max-width: 600px) {
      .error {
        font-size: 100px;
      }

      h1 {
        font-size: 28px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="astronaut">🚀</div>

    <div class="error">404</div>

    <h1>Page Not Found</h1>

    <p>
      Oops! The page you're looking for doesn't exist
      or may have been moved.
    </p>

    <a href="/" class="home-btn">
      ← Back to Home
    </a>

  </div>

</body>
</html>
